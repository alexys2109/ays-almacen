<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
               font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #e7ecf3; color: #1c2430; }
        .caja { max-width: 380px; width: 100%; background: #fff; border: 1px solid #d9e0ea; border-top: 5px solid #1e2633; border-radius: 18px;
                padding: 32px 26px; text-align: center; box-shadow: 0 10px 28px -12px rgba(16, 24, 40, .22); }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { color: #5f6b7e; margin: 0 0 22px; line-height: 1.5; font-size: .95rem; }
        a { display: block; padding: 12px 18px; border-radius: 10px; background: #1f3d6b; color: #fff; text-decoration: none; font-weight: 600; margin-bottom: 10px; }
        a.sec { background: #fff; color: #1f3d6b; border: 1px solid #b3c3dc; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>Sin conexión a internet</h1>
        <p>Esta sección necesita internet para funcionar. Mientras tanto puedes consultar los precios guardados en <b>Buscar productos</b>.</p>
        <a href="/">Ir a Buscar productos</a>
        <a href="javascript:location.reload()" class="sec">Reintentar</a>
    </div>
</body>
</html>
